<!DOCTYPE html>
<html lang="bg">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ResQ Village - Карта на България</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />
</head>
<body>

  <!-- Навигационна лента -->
  <header class="navbar">
    <a href="index.html" class="logo">🌍 ResQ Village</a>
    <ul class="nav-links">
      <li><a href="index.html">Начало</a></li>
      <li class="dropdown">
        <a href="#">Платформа ▼</a>
        <div class="dropdown-content">
          <a href="map.html">Карта на риска</a>
          <a href="#">(Очаквайте още страници)</a>
        </div>
      </li>
      <li><a href="#">Контакти</a></li>
    </ul>
    <div class="nav-auth">
      <div id="authButtons">
        <button class="btn-nav-login" onclick="openAuth('login')">🔑 Вход</button>
        <button class="btn-nav-register" onclick="openAuth('register')">📝 Регистрация</button>
      </div>
      <div id="userGreeting" style="display:none;">
        <div class="user-avatar" id="userAvatar">U</div>
        <span id="userName"></span>
        <button class="btn-nav-logout" onclick="logout()">Изход</button>
      </div>
    </div>
  </header>

<div id="map"></div>

<div class="legend">
  <strong>Нива на риск:</strong>
  <div class="low">● Нисък</div>
  <div class="medium">● Среден</div>
  <div class="high">● Висок</div>
</div>

<!-- Auth Modal -->
<div id="authModal">
  <div id="authModalContent">
    <button class="modal-close" onclick="closeAuth()">✕</button>
    <div class="auth-logo">🚑 ResQ Village</div>
    <div class="auth-tabs">
      <button class="auth-tab active" id="tabLogin" onclick="switchTab('login')">Вход</button>
      <button class="auth-tab" id="tabRegister" onclick="switchTab('register')">Регистрация</button>
    </div>
    <form id="loginForm" class="auth-form" onsubmit="doLogin(event)">
      <div class="input-group"><span class="input-icon">👤</span><input type="text" id="loginUser" placeholder="Потребителско име" required></div>
      <div class="input-group"><span class="input-icon">🔒</span><input type="password" id="loginPass" placeholder="Парола" required></div>
      <button type="submit" class="btn-auth-submit">Вход</button>
      <p class="auth-hint">Нямате акаунт? <a href="#" onclick="switchTab('register');return false;">Регистрирайте се</a></p>
    </form>
    <form id="registerForm" class="auth-form" style="display:none;" onsubmit="doRegister(event)">
      <div class="input-group"><span class="input-icon">👤</span><input type="text" id="regUser" placeholder="Потребителско име" required></div>
      <div class="input-group"><span class="input-icon">✉️</span><input type="email" id="regEmail" placeholder="Имейл" required></div>
      <div class="input-group"><span class="input-icon">🔒</span><input type="password" id="regPass" placeholder="Парола" required></div>
      <div class="input-group"><span class="input-icon">🔒</span><input type="password" id="regPass2" placeholder="Потвърдете паролата" required></div>
      <button type="submit" class="btn-auth-submit">Регистрация</button>
      <p class="auth-hint">Вече имате акаунт? <a href="#" onclick="switchTab('login');return false;">Влезте</a></p>
    </form>
    <p id="authMsg" class="auth-message"></p>
  </div>
</div>

<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
<script src="auth.js"></script>

<script>
  // Граници на България (bounding box)
  const southWest = L.latLng(41.2, 22.3);
  const northEast = L.latLng(44.3, 28.7);
  const bounds = L.latLngBounds(southWest, northEast);

  // Инициализация
  const map = L.map('map', {
    maxBounds: bounds,
    maxBoundsViscosity: 1.0
  }).fitBounds(bounds);

  // Забрана за zoom out извън България
  const initialZoom = map.getZoom();
  map.setMinZoom(initialZoom);

  // Карта - тъмна тема
  L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
    attribution: '© OpenStreetMap contributors, © CARTO'
  }).addTo(map);

  function getColor(risk) {
    if (risk === "low") return "#4ade80";
    if (risk === "medium") return "#fbbf24";
    return "#ef4444";
  }

  // Бъдещо развитие: Тук ще се зареждат данни за бедствия.
</script>

</body>
</html>
