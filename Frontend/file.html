<!DOCTYPE html>
<html lang="bg">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ResQ Village - Карта на България</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f4f6f9;
    }

    header {
      background: #1e3a8a;
      color: white;
      padding: 15px;
      text-align: center;
      font-size: 24px;
    }

    #map {
      height: 90vh;
      width: 100%;
    }

    .legend {
      position: absolute;
      bottom: 20px;
      left: 20px;
      background: white;
      padding: 10px;
      border-radius: 10px;
      box-shadow: 0 0 10px rgba(0,0,0,0.2);
    }

    .legend div {
      margin: 5px 0;
    }

    .low { color: green; }
    .medium { color: orange; }
    .high { color: red; }
  </style>

  <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />
</head>
<body>

<header>
  ResQ Village - Карта на риска в България
</header>

<div id="map"></div>

<div class="legend">
  <strong>Нива на риск:</strong>
  <div class="low">● Нисък</div>
  <div class="medium">● Среден</div>
  <div class="high">● Висок</div>
</div>

<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

<script>
  // Граници на България (bounding box)
  const southWest = L.latLng(41.2, 22.3);
  const northEast = L.latLng(44.3, 28.7);
  const bounds = L.latLngBounds(southWest, northEast);

  // Инициализация
  const map = L.map('map', {
    maxBounds: bounds,
    maxBoundsViscosity: 1.0
  }).fitBounds(bounds);

  // Забрана за zoom out извън България
  const initialZoom = map.getZoom();
  map.setMinZoom(initialZoom);

  // Карта
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    attribution: '© OpenStreetMap contributors'
  }).addTo(map);

  function getColor(risk) {
    if (risk === "low") return "green";
    if (risk === "medium") return "orange";
    return "red";
  }

  // Клик навсякъде в България → добавяне на бедствие
  map.on('click', function(e) {
    const risk = prompt("Въведи ниво на риск (low / medium / high):");

    if (!risk) return;

    const color = getColor(risk.toLowerCase());

    L.circleMarker(e.latlng, {
      radius: 8,
      color: color,
      fillColor: color,
      fillOpacity: 0.7
    })
    .addTo(map)
    .bindPopup(`📍 Бедствие<br>Риск: ${risk}`)
    .openPopup();
  });

  // Примерно предупреждение
  function showAlert() {
    alert("⚠️ КРИТИЧНО ПРЕДУПРЕЖДЕНИЕ: Засечено бедствие в региона!");
  }

  setTimeout(showAlert, 7000);
</script>

</body>
</html>
